services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
    ports: ["5432:5432"]
    volumes:
      - ./infra/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d bench"]
      interval: 2s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }

  rust-bench:
    build: ./implementation/rust
    environment:
      DATABASE_URL: postgres://bench:bench@db:5432/bench
    ports: ["3000:3000"]
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }