[package]
name = "bench-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
rust_decimal = "1.43.0"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "macros", "rust_decimal"] }
tokio = { version = "1.53.1", features = ["full"] }
